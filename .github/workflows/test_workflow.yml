name: Test package

on:
  workflow_call:
    inputs:
      tag:
        description: "Tag of DOLFINx docker image"
        default: "nightly"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of DOLFINx docker image"
        default: "nightly"
        required: true
        type: string
env:
  DEB_PYTHON_INSTALL_LAYOUT: deb_system
  DEFAULT_TAG: nightly
  HDF5_MPI: "ON"
  HDF5_INCLUDEDIR: "/usr/include/hdf5/openmpi"
  H5PY_SETUP_REQUIRES: 0
  OMPI_ALLOW_RUN_AS_ROOT: 1
  OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1
  PRTE_MCA_rmaps_default_mapping_policy: :oversubscribe
  CC: mpicc
  CXX: mpicxx
  # Works around open-mpi/ompi#13918: MPI_Dist_graph_create deadlocks at
  # random under the treematch topology component, because it exchanges edge
  # metadata on hard-coded tags -50/-51 that the nonblocking-collective tag
  # allocator can count down into. Selecting the basic component avoids it.
  # Fixed upstream by open-mpi/ompi#13933, first tagged in OpenMPI v5.0.11;
  # the image currently ships 5.0.10. MPICH ignores the variable, so it is
  # safe to set unconditionally. Drop once the image has OpenMPI >= 5.0.11.
  OMPI_MCA_topo: basic
  # MEDCoupling (LGPL) writes the reference MED files in tests/test_med.py
  MEDCOUPLING_VERSION: V9_15_0
  MEDCOUPLING_PREFIX: /opt/medcoupling
  # MED-fichier (LGPL) from the copy conda-forge uses, as Salome's server blocks
  # automated downloads
  MEDFILE_VERSION: "4.2"
  MEDFILE_SHA256: a0193de4f0fef916ea9b83fb3e69e0717068a6bb41474ea8b6b0dece10b56d13
jobs:
  get_image_tag:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.docker_tag.outputs.image }}
    steps:
      - id: docker_tag
        run: echo "image=${{ inputs.tag || env.DEFAULT_TAG }}" >> $GITHUB_OUTPUT

  test-code:
    # Leaves room for building MEDCoupling on a cache miss
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    # The container tag is now dynamic based on the input passed by the caller
    container: ghcr.io/fenics/test-env:current
    needs:
      [get_image_tag]
    env:
      working-directory: ./src

    steps:
      - uses: actions/checkout@v7

      - name: Update pip
        run: python3 -m pip install --upgrade pip

      - name: Install build requirements
        run: python3 -m pip install --group build --no-build-isolation


      # Note: We assume the caller workflow has already uploaded these artifacts
      - name: Download legacy mpich data
        uses: actions/download-artifact@v8
        with:
          name: legacy_mpich
          path: ./legacy

      - name: Download legacy checkpoint mpich data
        uses: actions/download-artifact@v8
        with:
          name: legacy_checkpoint_mpich
          path: ./legacy_checkpoint

      - name: Install DOLFINx (stable)
        if: needs.get_image_tag.outputs.image == 'stable'
        uses: jorgensd/actions/install-dolfinx@v0.4
        with:
          adios2: default
          petsc_arch: linux-gnu-real64-32
          dolfinx: release
          basix: release
          ufl: release
          ffcx: release
          working-directory: ${{ env.working-directory}}

      - name: Install DOLFINx (nightly)
        if: needs.get_image_tag.outputs.image == 'nightly'
        uses: jorgensd/actions/install-dolfinx@v0.4
        with:
          adios2: default
          petsc_arch: linux-gnu-real64-32
          working-directory: ${{ env.working-directory}}

      - name: Configure HDF5 MPI Environment
        run: |
          # Evaluate architecture dynamically and write to GITHUB_ENV
          ARCH_TRIPLET=$(gcc -print-multiarch)
          echo "HDF5_LIBDIR=/usr/lib/${ARCH_TRIPLET}/hdf5/openmpi" >> $GITHUB_ENV

      - name: Install package
        run: |
          python3 -m pip install "Cython>=3.0.11" "pkgconfig>=1.5.5"
          python3 -m pip install h5py --no-binary=h5py --no-build-isolation
          python3 -m pip install --group dev --group test
          python3 -m pip install . --no-build-isolation

      - name: Get Python version
        id: python
        run: echo "version=$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')" >> $GITHUB_OUTPUT

      # MEDCoupling has no wheels for recent Python versions, so it is built from
      # source, with MED-fichier, against the image's MPI HDF5. Ubuntu's
      # MED-fichier 4.1.0 lacks API that MEDCoupling 9.15 uses.
      - name: Install MEDCoupling dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends swig

      - name: Cache MEDCoupling
        id: cache-medcoupling
        uses: actions/cache@v6
        with:
          path: ${{ env.MEDCOUPLING_PREFIX }}
          key: medcoupling-${{ env.MEDCOUPLING_VERSION }}-med${{ env.MEDFILE_VERSION }}-py${{ steps.python.outputs.version }}-${{ runner.arch }}

      - name: Build MED-fichier
        if: steps.cache-medcoupling.outputs.cache-hit != 'true'
        run: |
          wget -q -O /tmp/med.tar.gz https://github.com/Krande/med-copy/archive/refs/tags/${MEDFILE_VERSION}.tar.gz
          echo "${MEDFILE_SHA256}  /tmp/med.tar.gz" | sha256sum -c -
          mkdir /tmp/med && tar -xzf /tmp/med.tar.gz -C /tmp/med --strip-components=1
          cmake -G Ninja -S /tmp/med -B /tmp/med-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=${MEDCOUPLING_PREFIX} \
            -DHDF5_ROOT_DIR=${HDF5_ROOT} \
            -DMEDFILE_BUILD_TESTS=OFF \
            -DMEDFILE_INSTALL_DOC=OFF \
            -DMEDFILE_BUILD_PYTHON=OFF
          cmake --build /tmp/med-build
          cmake --install /tmp/med-build

      - name: Build MEDCoupling
        if: steps.cache-medcoupling.outputs.cache-hit != 'true'
        run: |
          for repo in configuration medcoupling; do
            git clone --depth 1 -b ${MEDCOUPLING_VERSION} https://github.com/SalomePlatform/${repo}.git /tmp/${repo}
          done
          # MEDCoupling requires CMake 2.8.11, which CMake 4 rejects; policies at 3.5
          # also keep the legacy FindPythonInterp/FindPythonLibs that Salome uses.
          # SALOME_USE_MPI is required for a parallel HDF5; ParaMEDMEM stays off.
          # 32-bit ids match MED-fichier's default 32-bit med_int.
          # Makefiles, not Ninja: the SWIG-generated .py files are compiled to .pyc
          # by a rule that Ninja rejects, as they are not declared build outputs.
          cmake -G "Unix Makefiles" -S /tmp/medcoupling -B /tmp/medcoupling-build \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=${MEDCOUPLING_PREFIX} \
            -DCONFIGURATION_ROOT_DIR=/tmp/configuration \
            -DMEDFILE_ROOT_DIR=${MEDCOUPLING_PREFIX} \
            -DSALOME_USE_MPI=ON \
            -DMEDCOUPLING_USE_MPI=OFF \
            -DMEDCOUPLING_USE_64BIT_IDS=OFF \
            -DMEDCOUPLING_ENABLE_PARTITIONER=OFF \
            -DMEDCOUPLING_ENABLE_RENUMBER=OFF \
            -DMEDCOUPLING_MEDLOADER_USE_XDR=OFF \
            -DMEDCOUPLING_BUILD_TESTS=OFF \
            -DMEDCOUPLING_BUILD_PY_TESTS=OFF \
            -DMEDCOUPLING_BUILD_DOC=OFF \
            -DMEDCOUPLING_WITH_FILE_EXAMPLES=OFF
          cmake --build /tmp/medcoupling-build --parallel $(nproc)
          cmake --install /tmp/medcoupling-build

      - name: Make MEDCoupling importable
        run: |
          echo "PYTHONPATH=${MEDCOUPLING_PREFIX}/lib/python${{ steps.python.outputs.version }}/site-packages${PYTHONPATH:+:${PYTHONPATH}}" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=${MEDCOUPLING_PREFIX}/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}" >> $GITHUB_ENV

      - name: Show MEDCoupling version
        run: python3 -c "import medcoupling; print(medcoupling.__version__)"

      - name: Show adios2 version
        run: python3 -c "import adios2; print(adios2.__version__)"

      - name: Show h5py version
        run: python3 -c "import h5py; print(h5py.__version__)"

      - name: Show hdf5 version
        run: python3 -c "import h5py; print(h5py.version.hdf5_version)"

      - name: Run tests
        run: coverage run --rcfile=.coveragerc -m pytest -xvs ./tests/

      - name: Run tests in parallel
        run: mpirun -n 4 coverage run --rcfile=.coveragerc -m mpi4py -m pytest -xvs ./tests/

      - name: Combine coverage reports
        run: |
          coverage combine
          coverage report -m
          coverage html

      # Use the tag in the artifact name so parallel runs don't overwrite each other
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage-report-${{ inputs.tag }}
          path: htmlcov
          if-no-files-found: error
