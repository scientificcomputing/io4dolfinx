name: Build documentation

# Builds the documentation and uploads its HTML as the artifact `docs`. The deploy workflow
# (deploy_pages.yml) also uses it to build each version of the web page: given `ref`, `image`
# and `asset`, it builds that commit in that image and uploads the HTML as the tarball `asset`.
on:
  workflow_call:
    inputs:
      tag:
        description: "Tag of DOLFINx docker image"
        default: "stable"
        required: false
        type: string
      ref:
        description: "Commit, branch or tag to build, if not the one that triggered the workflow"
        default: ""
        required: false
        type: string
      image:
        description: "DOLFINx docker image to build in, replacing `tag`"
        default: ""
        required: false
        type: string
      asset:
        description: "Upload the HTML as this tarball, e.g. docs-v1.5.1.tar.gz, for the deploy"
        default: ""
        required: false
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of DOLFINx docker image"
        default: "stable"
        required: true
        type: string
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 8 * * *"

env:
  DEB_PYTHON_INSTALL_LAYOUT: deb_system
  DEFAULT_TAG: stable
  ARTIFACT_NAME: docs
  PUBLISH_DIR: ./_build/html
  PIP_NO_BINARY: h5py
  OMPI_ALLOW_RUN_AS_ROOT: 1
  OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1
  PRTE_MCA_rmaps_default_mapping_policy: :oversubscribe
  # Works around open-mpi/ompi#13918: MPI_Dist_graph_create deadlocks at
  # random under the treematch topology component, because it exchanges edge
  # metadata on hard-coded tags -50/-51 that the nonblocking-collective tag
  # allocator can count down into. Selecting the basic component avoids it.
  # Fixed upstream by open-mpi/ompi#13933, first tagged in OpenMPI v5.0.11;
  # the image currently ships 5.0.10. MPICH ignores the variable, so it is
  # safe to set unconditionally. Drop once the image has OpenMPI >= 5.0.11.
  OMPI_MCA_topo: basic
jobs:
  get_image_tag:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.docker_tag.outputs.image }}
    steps:
      - id: docker_tag
        run: echo "image=${{ inputs.tag || env.DEFAULT_TAG }}" >> $GITHUB_OUTPUT

  build-docs:
    timeout-minutes: 30
    needs: get_image_tag
    runs-on: ubuntu-latest
    container: ${{ inputs.image || format('ghcr.io/fenics/dolfinx/dolfinx:{0}', needs.get_image_tag.outputs.image) }}

    steps:
      # This action sets the current path to the root of your github repo
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Update pip
        run: python3 -m pip install --upgrade pip setuptools

      # Without HDF5_MPI, h5py builds against the image's parallel HDF5 in
      # serial mode, so the multi-rank ipyparallel examples cannot use it.
      - name: Install h5py with MPI support
        env:
          HDF5_MPI: "ON"
          HDF5_DIR: /usr/local
          CC: mpicc
        run: |
          python3 -m pip install "Cython>=3.0.11" "pkgconfig>=1.5.5"
          python3 -m pip install h5py --no-binary=h5py --no-build-isolation
          python3 -c "import h5py; assert h5py.get_config().mpi, 'h5py built without MPI'"

      # Releases before v1.4.0 have the docs dependencies as an extra, not a dependency group
      - name: Install docs dependencies
        run: |
          if grep -q '^\[dependency-groups\]' pyproject.toml; then
            python3 -m pip install . --group docs
          else
            python3 -m pip install ".[docs]"
          fi

      - name: Install dependencies
        run: python3 -m pip install -e . --no-build-isolation

      - name: Build docs
        run: jupyter book build .

      - name: Upload documentation as artifact
        uses: actions/upload-artifact@v7
        if: ${{ always() && !inputs.asset }}
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.PUBLISH_DIR }}
          if-no-files-found: error

      # A tarball keeps hidden files and permissions, and is what gets archived
      - name: Package documentation for the web page
        if: ${{ inputs.asset }}
        run: tar -czf "${{ inputs.asset }}" -C "${{ env.PUBLISH_DIR }}" .

      - name: Upload packaged documentation
        if: ${{ inputs.asset }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.asset }}
          path: ${{ inputs.asset }}
          if-no-files-found: error
          retention-days: 1
