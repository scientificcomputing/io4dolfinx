[build-system]
requires = [
    "scikit-build-core[pyproject]>=0.11.0",
    "nanobind>=1.3.2,<3.0",  # Temporary cap as 0.11 seems to struggle with nanobind 3.0.0
    "setuptools>=77.0.3",
    "packaging>=24.2",
    "pkgconfig"
]
build-backend = "scikit_build_core.build"

[project]
name = "io4dolfinx"
version = "1.3.0"
description = "Checkpointing functionality for DOLFINx meshes/functions with ADIOS2"
authors = [
    { name = "Jørgen S. Dokken", email = "dokken@simula.no" },
    { name = "Henrik N.T. Finsberg", email = "henriknf@simula.no" }
]
license = { file = "LICENSE" }
readme = "README.md"
dependencies = ["fenics-dolfinx>=0.10.0", "packaging"]

[project.optional-dependencies]
h5py = ["h5py"]
pyvista = ["pyvista"]
xdmf = ["h5py"]
exodus = ["netcdf4"]

[dependency-groups]
build = [
    "scikit-build-core[pyproject]>=0.11.0",
    "nanobind>=1.3.2,<3.0",
    "setuptools>=77.0.3",
    "packaging>=24.2",
    "pkgconfig"
]

test = [
    "pytest",
    "coverage",
    "ipyparallel",
    "io4dolfinx[h5py]",
    "io4dolfinx[pyvista]",
    "io4dolfinx[xdmf]"
]
dev = [
    "pdbpp",
    "ipython",
    "mypy",
    "ruff"
]
docs = [
    "jupyter-book<2.0.0",
    "ipyparallel",
    "ipywidgets",
    "jupytext",
    "ipykernel",
    "sphinx-codeautolink",
    "io4dolfinx[h5py]",
    "io4dolfinx[pyvista]",
    "sphinx_external_toc<1.1.0",
]
all = [
    { include-group = "test" },
    { include-group = "dev" },
    { include-group = "docs" }
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]

[tool.mypy]
ignore_missing_imports = true
# Folders to exclude
exclude = ["docs/", "build/"]
# Folder to check with mypy
files = ["src", "tests"]

[tool.ruff]
src = ["src", "tests", "docs"]
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = [
    # Pyflakes
    "F",
    # Pycodestyle
    "E",
    "W",
    # isort
    "I001",
]

[tool.ruff.lint.isort]
known-first-party = ["io4dolfinx"]
known-third-party = [
    "basix",
    "dolfinx",
    "ffcx",
    "ufl",
    "gmsh",
    "numpy",
    "pytest",
]
section-order = [
    "future",
    "standard-library",
    "mpi",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
"mpi" = ["mpi4py", "petsc4py"]

[tool.bumpversion]
allow_dirty = false
commit = true
message = "Bump version: {current_version} → {new_version}"
tag = true
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
current_version = "1.3.0"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'
